[General]

network = inet.tutorials.wireless.BTL_WSN_NhaMay
sim-time-limit = 20s

# =========================================================
# 1. MOBILITY
# =========================================================
*.sensor*.mobility.typename = "StationaryMobility"
*.sink.mobility.typename = "StationaryMobility"
*.noiseSource.mobility.typename = "StationaryMobility"

*.sensor*.mobility.initFromDisplayString = true
*.sink.mobility.initFromDisplayString = true
*.noiseSource.mobility.initFromDisplayString = true


# =========================================================
# 2. UDP TRAFFIC
# 4 sensor gửi về sink
# =========================================================
*.sensor*.numApps = 1
*.sensor*.app[0].typename = "UdpBasicApp"
*.sensor*.app[0].destAddresses = "sink"
*.sensor*.app[0].destPort = 5000
*.sensor*.app[0].messageLength = 100B
*.sensor*.app[0].sendInterval = 50ms
*.sensor*.app[0].startTime = uniform(0ms,20ms)

*.sink.numApps = 1
*.sink.app[0].typename = "UdpSink"
*.sink.app[0].localPort = 5000


# =========================================================
# 3. WIRELESS INTERFACE + MAC
# =========================================================
**.wlan[*].typename = "WirelessInterface"

**.wlan[*].mac.typename = "CsmaCaMac"
**.wlan[*].mac.useAck = false
**.wlan[*].mac.bitrate = 2Mbps

**.wlan[*].queue.typename = "DropTailQueue"
**.wlan[*].queue.packetCapacity = 200


# =========================================================
# 4. RADIO
# =========================================================
**.wlan[*].radio.typename = "ApskRadio"
**.wlan[*].radio.signalAnalogRepresentation = "dimensional"

**.wlan[*].radio.centerFrequency = 2.4GHz
**.wlan[*].radio.bandwidth = 2MHz

**.wlan[*].radio.transmitter.bitrate = 2Mbps
**.wlan[*].radio.transmitter.power = 2mW
**.wlan[*].radio.transmitter.preambleDuration = 10us
**.wlan[*].radio.transmitter.headerLength = 8B

**.wlan[*].radio.receiver.sensitivity = -90dBm
**.wlan[*].radio.receiver.energyDetection = -95dBm
**.wlan[*].radio.receiver.snirThreshold = 4dB


# =========================================================
# 5. RADIO MEDIUM + BACKGROUND NOISE
# =========================================================
*.radioMedium.signalAnalogRepresentation = "dimensional"

*.radioMedium.sameTransmissionStartTimeCheck = "ignore"

*.radioMedium.backgroundNoise.power = nan
*.radioMedium.backgroundNoise.powerSpectralDensity = -110dBmWpMHz


# =========================================================
# 6. NOISE SOURCE
# =========================================================
*.noiseSource.transmitter.signalAnalogRepresentation = "dimensional"
*.noiseSource.transmitter.centerFrequency = 2.4GHz
*.noiseSource.transmitter.bandwidth = 2MHz


# =========================================================
# 7. GHI KẾT QUẢ KPI
# =========================================================

# Packet sent / received
*.sensor*.app[0].packetSent.result-recording-modes = count
*.sink.app[0].packetReceived.result-recording-modes = count

# Delay tại sink
*.sink.app[0].rcvdPkLifetime.result-recording-modes = mean,min,max,vector

# SNIR tại radio của sink
*.sink.wlan[0].radio.minSnir.result-recording-modes = mean,vector

# Bật ghi scalar/vector
**.scalar-recording = true
**.vector-recording = true


# =========================================================
# KB1 - KHÔNG NHIỄU
# =========================================================
[Config KB1_KhongNhieu]

*.noiseSource.transmitter.power = 0mW
*.noiseSource.transmitter.duration = 1ms
*.noiseSource.sleepInterval = 9ms


# =========================================================
# KB2 - CÓ NHIỄU MẠNH
# Dùng stress test để chắc chắn thấy chênh lệch
# Duty cycle = 9 / (9 + 1) = 90%
# =========================================================
[Config KB2_CoNhieu]

*.noiseSource.transmitter.power = 100mW
*.noiseSource.transmitter.duration = 9ms
*.noiseSource.sleepInterval = 1ms


# =========================================================
# KB3 - GIẢM NHIỄU
# Giữ cùng công suất nhiễu với KB2
# nhưng giảm duty cycle xuống 20%
# Duty cycle = 2 / (2 + 8) = 20%
# =========================================================
[Config KB3_GiamNhieu]

*.noiseSource.transmitter.power = 100mW
*.noiseSource.transmitter.duration = 2ms
*.noiseSource.sleepInterval = 8ms